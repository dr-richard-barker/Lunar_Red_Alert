Background@LEAGUETABLE_BG:
	Logic: LeagueTableLogic
	X: (WINDOW_RIGHT - WIDTH) / 2
	Y: (WINDOW_BOTTOM - HEIGHT) / 2
	Width: 600
	Height: 450
	Children:
		LogicTicker@TICKER:
		Label@TITLE:
			Y: 15
			Width: PARENT_RIGHT
			Height: 25
			Text: button-leaguetable-title
			Align: Center
			Font: Bold
		Container@HEADER_ROW:
			X: 20
			Y: 50
			Width: PARENT_RIGHT - 40
			Height: 20
			Children:
				Label@HEADER_DATE:
					X: 0
					Width: 120
					Height: 20
					Text: label-leaguetable-header-date
					Font: Small
				Label@HEADER_RESULT:
					X: 130
					Width: 80
					Height: 20
					Text: label-leaguetable-header-result
					Font: Small
				Label@HEADER_SCORE:
					X: 220
					Width: 80
					Height: 20
					Text: label-leaguetable-header-score
					Font: Small
				Label@HEADER_KILLS:
					X: 310
					Width: 80
					Height: 20
					Text: label-leaguetable-header-kills
					Font: Small
				Label@HEADER_INCOME:
					X: 400
					Width: 80
					Height: 20
					Text: label-leaguetable-header-income
					Font: Small
				Label@HEADER_DURATION:
					X: 490
					Width: 70
					Height: 20
					Text: label-leaguetable-header-duration
					Font: Small
		ScrollPanel@LEAGUE_LIST:
			X: 15
			Y: 75
			Width: PARENT_RIGHT - 30
			Height: PARENT_BOTTOM - 130
			Children:
				ScrollItem@LEAGUE_TEMPLATE:
					Width: PARENT_RIGHT - 27
					Height: 25
					Children:
						Label@DATE:
							X: 5
							Y: 0
							Width: 120
							Height: 25
							Font: Tiny
						Label@RESULT:
							X: 135
							Y: 0
							Width: 80
							Height: 25
							Font: Tiny
						Label@SCORE:
							X: 225
							Y: 0
							Width: 80
							Height: 25
							Font: Tiny
						Label@KILLS:
							X: 315
							Y: 0
							Width: 80
							Height: 25
							Font: Tiny
						Label@INCOME:
							X: 405
							Y: 0
							Width: 80
							Height: 25
							Font: Tiny
						Label@DURATION:
							X: 495
							Y: 0
							Width: 70
							Height: 25
							Font: Tiny
				ScrollItem@LEAGUE_EMPTY_TEMPLATE:
					Width: PARENT_RIGHT - 27
					Height: 25
					Children:
						Label@EMPTY:
							X: 5
							Y: 0
							Width: PARENT_RIGHT
							Height: 25
							Text: label-leaguetable-empty
							Font: Tiny
		Button@BACK_BUTTON:
			X: (PARENT_RIGHT - WIDTH) / 2
			Y: PARENT_BOTTOM - 45
			Width: 140
			Height: 35
			Text: button-back
			Font: Bold
			Key: escape
