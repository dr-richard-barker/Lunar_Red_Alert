# Lunar tileset — terrain-type definitions (the movement/behaviour layer).
#
# OpenRA is a 2.5D SPRITE engine: there is no runtime heightmap. "Craters" are
# authored as tiles + impassable cliff walls, not procedural geometry. This file
# defines the terrain TYPES and their movement classes; the actual tile sprites
# and Templates are generated by tools/gen_tileset.py and appended below it.
#
# This is the skeleton header. Fill Templates from the generator output, and base
# the General/Editor sections on mods/ra/tilesets/temperat.yaml.

General:
	Name: Lunar
	Id: LUNAR
	SheetSize: 512
	EnableDepth: False

Terrain:
	TerrainType@Clear:
		Type: Clear
		TargetTypes: Ground
		AcceptsSmudgeType: Crater, Scorch
		# dusty grey; drives the minimap
		Color: 9A9086
		RestrictPlayerColor: true
	TerrainType@Rough:
		Type: Rough
		TargetTypes: Ground
		AcceptsSmudgeType: Crater, Scorch
		Color: 6E655C
	TerrainType@Road:
		Type: Road
		TargetTypes: Ground
		AcceptsSmudgeType: Crater, Scorch
		Color: 4A4A52
	TerrainType@Bridge:
		Type: Bridge
		TargetTypes: Ground, Bridge
		AcceptsSmudgeType: Crater, Scorch
		Color: 4A4A52
	TerrainType@Ore:
		Type: Ore
		TargetTypes: Ground
		AcceptsSmudgeType: Crater, Scorch
		Color: BFE9FF
		RestrictPlayerColor: true
	TerrainType@Gems:
		Type: Gems
		TargetTypes: Ground
		AcceptsSmudgeType: Crater, Scorch
		Color: BFE9FF
		RestrictPlayerColor: true
	TerrainType@Beach:
		Type: Beach
		TargetTypes: Ground
		AcceptsSmudgeType: Crater, Scorch
		Color: 9A9086
	TerrainType@Water:
		Type: Water
		TargetTypes: Water
		Color: 101014
	TerrainType@CraterFloor:
		Type: CraterFloor
		Color: 6E655C
	TerrainType@CraterWall:
		Type: CraterWall
		Color: 3B342E
		# Cliffs are impassable to ground units — set movement in the mod's
		# ^Vehicle/^Soldier Mobile Locomotor "TerrainSpeeds" to 0 for CraterWall.
	TerrainType@Basalt:
		Type: Basalt
		Color: 4A4A52
	TerrainType@IceDeposit:
		# the harvestable resource terrain (see ResourceLayer)
		Type: IceDeposit
		Color: BFE9FF
	TerrainType@Vacuum:
		# exposed void; combine with GrantConditionOnTerrain
		Type: Vacuum
		# if you want terrain (not just "no dome") to expose units
		Color: 101014

# Templates:
#   (generated) — one Template block per tile, produced by tools/gen_tileset.py
Templates:
	Template@0:
		Id: 0
		Images: lunar_tiles
		Size: 8,1
		Tiles:
			0: Clear
			1: Clear
			2: Clear
			3: CraterFloor
			4: CraterFloor
			5: CraterWall
			6: CraterWall
			7: Basalt
