# Space-Age: Lunar/Mars now have their own dedicated tilesets (tilesets/
# lunar.yaml, tilesets/mars.yaml) with real generated art, and Earth uses
# ysmir.oramap's stock TEMPERAT tileset unmodified -- so the three terrain
# modes should look genuinely distinct (real green/water Earth, grey/ice
# Lunar, orange/brown/snow Mars), not funnelled through one shared "make
# everything read as lunar" reskin the way earlier passes did before the
# dedicated tilesets existed.
#
# What used to live here (removed): a `terrain-temperat` palette override
# to desert.pal, a whole-scene TintPostProcessEffect pulling green/blue
# down, and an unconditional tree -> rock actor-type swap. All three
# applied identically no matter which of the three maps (ysmir/-lunar/
# -mars) was loaded, since rules are mod-wide, not per-map -- which
# actively worked against Earth looking like Earth. The rock swap below
# is kept, just moved onto separate T01ROCK.../TC05ROCK... actor types
# that ONLY ysmir-lunar.oramap/ysmir-mars.oramap's own Actors: lists
# reference (renamed there from t01/tc01/etc to t01rock/tc01rock/etc);
# ysmir.oramap's Actors: list is untouched, so Earth keeps real t01..t17/
# tc01..tc05 trees rendering as stock RA trees.
#
# Kept as-is: LUNAR/MARS still need a palette literally named "terrain" to
# exist (TileSet.TerrainPaletteInternalName) or WorldLoaded crashes outright
# (confirmed live earlier this session: "Palette `terrain` does not exist").
# They have no base ra|rules/palettes.yaml entry to override (those tilesets
# don't exist there), so these stay full definitions. Since the Lunar/Mars
# tile art is RGBA PNG rather than indexed, this palette's actual colour
# values don't drive the ground's look, only its presence -- desert.pal is
# just a real, always-available .pal file to point at.
^Palettes:
	PaletteFromFile@terrain-lunar:
		Name: terrain
		Tileset: LUNAR
		Filename: desert.pal
		ShadowIndex: 3, 4
	PaletteFromFile@terrain-mars:
		Name: terrain
		Tileset: MARS
		Filename: desert.pal
		ShadowIndex: 3, 4

# --- Trees -> lunar/mars boulders and crater rims ---------------------------
# Cycled across the seven rock props so a treeline becomes a varied rock
# field rather than a row of identical stones. Inherits the real tree type
# (footprint, husk-on-death, etc.) so pathing/cover is unaffected -- only
# the rendered sprite changes.

T01ROCK:
	Inherits: T01
	RenderSprites:
		Image: rock1
		Palette: desert

T02ROCK:
	Inherits: T02
	RenderSprites:
		Image: rock2
