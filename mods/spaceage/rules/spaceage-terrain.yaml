# Space-Age: make stock Red Alert maps read as lunar surface.
#
# A full lunar TILESET (tilesets/lunar-template.yaml + generated tile sheets) is
# still the end goal, but it needs an art pipeline to turn generated tiles into
# a sheet the engine can load. This file gets most of the visual payoff without
# that pipeline, so every existing RA map plays as Moon terrain today:
#
#   1. Trees become boulders/craters. Trees are the single strongest "Earth"
#      signal on a map -- a vegetated battlefield can never read as lunar. The
#      rock props already ship with the desert theatre content, so this is a
#      sprite swap with no new art. Footprints are left alone so existing maps
#      keep their pathing and cover exactly as authored.
#   2. A cool, slightly darkened tint over the whole scene, which pushes RA's
#      warm greens and browns toward airless grey.
#
# The rocks are drawn with the desert palette (as ra's own ^Rock does); that
# palette is declared without a Tileset filter in ra|rules/palettes.yaml, so it
# resolves on temperate/snow/interior maps too.

World:
	# Regolith cast. This effect can only scale each channel, so it cannot
	# desaturate directly -- the way to neutralise colour is to pull DOWN the
	# channels the source art is strongest in. RA's terrain is dominated by
	# green (temperate) and blue (snow/water), so both come down while red
	# stays full, which drags the palette toward the warm grey-tan of Apollo
	# surface photography instead of tinting it.
	#
	# An earlier pass raised blue instead and simply made everything look like
	# cold blue snow, which is the opposite of the intended read.
	TintPostProcessEffect:
		Red: 1.0
		Green: 0.92
		Blue: 0.82
		Ambient: 0.97

# A felled "tree" should leave broken rock, not a charred stump. Every tree
# husk inherits this base, so one override covers all of them.
^TreeHusk:
	RenderSprites:
		Image: rock2
		Palette: desert

# --- Trees -> lunar boulders and crater rims -------------------------------
# Cycled across the seven rock props so a treeline becomes a varied rock field
# rather than a row of identical stones.

