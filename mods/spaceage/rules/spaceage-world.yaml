# Space-Age: world-level gravity. Merges into the base World actor defined in
# ra|rules/world.yaml (loaded earlier), adding the LowGravity trait read by arcing
# projectiles.
World:
	LowGravity:
		# 16 = Moon, 38 = Mars, 100 = Earth
		GravityPercent: 16

	ResourceRenderer:
		ResourceTypes:
			Ore:
				Sequences: gem01, gem02, gem03, gem04
				Palette: player
				Name: resource-minerals

	Locomotor@FOOT:
		TerrainSpeeds:
			CraterFloor: 89
			Basalt: 89
			IceDeposit: 89
			Vacuum: 100

	Locomotor@WHEELED:
		TerrainSpeeds:
			CraterFloor: 50
			Basalt: 50
			IceDeposit: 88
			Vacuum: 100

	Locomotor@HEAVYWHEELED:
		TerrainSpeeds:
			CraterFloor: 50
			Basalt: 50
			IceDeposit: 88
			Vacuum: 100

	Locomotor@LIGHTTRACKED:
		TerrainSpeeds:
			CraterFloor: 88
			Basalt: 88
			IceDeposit: 88
			Vacuum: 100

	Locomotor@TRACKED:
		TerrainSpeeds:
			CraterFloor: 88
			Basalt: 88
			IceDeposit: 88
			Vacuum: 100

	Locomotor@HEAVYTRACKED:
		TerrainSpeeds:
			CraterFloor: 88
			Basalt: 88
			IceDeposit: 88
			Vacuum: 100

	SpawnStartingUnits:
		StartingUnitsClass: light
