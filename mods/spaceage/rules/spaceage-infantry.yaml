# Space-Age: per-unit oxygen tuning. Loaded after ra|rules/infantry.yaml +
# spaceage-defaults.yaml, so these merge onto specific actors (which already inherit
# the ^Soldier vacuum traits).

# Rifle Infantry — small tank, suffocates quickly
E1:
	Oxygen:
		Capacity: 5000
		DrainRate: 3
	DamagedByVacuum:
		Damage: 350

# Rocket Soldier — standard suit
E3:
	Oxygen:
		Capacity: 6000

# Engineer — oversized life-support pack, lasts much longer
E6:
	Oxygen:
		Capacity: 9000
		DrainRate: 1
		RefillRate: 60
