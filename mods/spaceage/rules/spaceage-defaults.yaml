# Space-Age: environmental traits layered onto the base RA templates.
# Loaded AFTER ra|rules/defaults.yaml, so these nodes merge into ^Soldier / ^Vehicle.
#
# Condition flow:
#   pressurised  granted to units inside a life-support bubble (see spaceage-structures.yaml);
#                the unit must declare ExternalCondition@PRESSURE to receive it.
#   no-oxygen    granted by Oxygen when the tank hits zero; consumed here to slow the unit.
#
# Vehicles are implicitly vacuum-proof: they simply don't get Oxygen / DamagedByVacuum.

# Dummy actor to declare Vacuum damage type for the linter
VacuumDamageTypeDecl:
	Armor:
		Type: VacuumDecl
	Armor@vacuum:
		Type: none

^Soldier:
	# Declare that this unit is willing to RECEIVE the pressurised external condition.
	ExternalCondition@PRESSURE:
		Condition: pressurised
	Oxygen:
		Capacity: 6000
		DrainRate: 2
		RefillRate: 40
		DepletedCondition: no-oxygen
		PressurisedCondition: pressurised
	OxygenBar:
	DamagedByVacuum:
		Damage: 300
		DamageInterval: 16
		DamageTypes: Vacuum
		SafeCondition: pressurised
		RequireOxygenDepleted: true
	# Low-gravity bounding stride.
	GravitySpeedModifier@LOWG:
		Modifier: 140
	# Gasping for air: half speed while the O2 tank is empty (consumes no-oxygen).
	GravitySpeedModifier@SUFFOCATING:
		RequiresCondition: no-oxygen
		Modifier: 50

^Vehicle:
	# Sealed cabins: no oxygen worries, just gentler low-g handling than infantry.
	GravitySpeedModifier@LOWG:
		Modifier: 110

Player:
	LeagueTableManager:
	# Lets the War/Peace toggle (GameLoop.ToggleWarPeace) reach into the
	# "normal" AI's own build/attack logic, not just the diplomatic
	# relationship. Granted/revoked externally in C#, never by any trait
	# here -- see ra|rules/ai.yaml's ModularBot@NormalAI for the bot type
	# this gates, and the SquadManagerBotModule@normal/UnitBuilderBotModule@
	# normal overrides below for what it actually disables.
	ExternalCondition@PEACE:
		Condition: peace-mode
	# Overrides of ra|rules/ai.yaml's "normal" AI modules (same trait keys,
	# MiniYaml field-level merge -- every other configured field, e.g.
	# SquadSize, ProtectionTypes, is inherited unchanged from the base
	# definition there). Peace mode should mean "focus on building and
	# growth", not "still forms and launches attack squads that just have
	# nobody to fight" -- so both the human's own autoplay AI
	# (GameLoop.ToggleAutoplay) and any AI rival opponent stop RAISING new
	# squads/combat units while at peace. ResourceMapBotModule,
	# HarvesterBotModule@normal-turtle, BaseBuilderBotModule@normal and
	# McvExpansionManagerBotModule@normal are untouched, so economy and base
	# construction (including defensive structures already in that build
	# order) keep running exactly as before.
	SquadManagerBotModule@normal:
		RequiresCondition: enable-normal-ai && !peace-mode
	UnitBuilderBotModule@normal:
		RequiresCondition: enable-normal-ai && !peace-mode

# A wide-range camera for the browser build's "fully visible map" showcase
# maps (ysmir/ysmir-lunar/ysmir-mars) -- RevealsShroud isn't overridable
# per-instance from a map's Actors: list (no registered Init for it), so
# the wider Range has to live on a real actor type instead. Self-contained
# (not `Inherits: CAMERA`, ra|rules/misc.yaml) rather than a cross-file
# inherit, matching CAMERA's own trait list exactly. Range is capped at 50
# (the engine's TileSearchRange limit -- confirmed live: a 70c0 range threw
# "requested range (71) cannot exceed TileSearchRange (50)" every game-loop
# tick after boot); the maps place a 3x3 grid of these to jointly cover the
# full 90x90 playable area instead of one oversized camera. Confirmed live
# that even Range: 50c0 throws ("requested range (51) cannot exceed
# TileSearchRange (50)") -- the WDist->cell conversion rounds up by one --
# so this stays a few cells under the real 50-cell hard cap.
MAPCAMERA:
	Interactable:
	Immobile:
		OccupiesSpace: false
	RevealsShroud:
		Range: 45c0
		Type: CenterPosition
	BodyOrientation:
		QuantizedFacings: 1
	WithSpriteBody:
	RenderSpritesEditorOnly:
		Image: camera
	MapEditorData:
		Categories: System
