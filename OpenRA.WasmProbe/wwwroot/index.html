<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Without this, mobile browsers lay the page out at a default desktop-ish
     viewport width and then zoom the whole page to fit the screen, which is
     a real source of click/tap coordinates not lining up with what's drawn. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OpenRA WasmProbe — Phase W2</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0a0e14; color: #cdd6e2; font: 14px/1.5 monospace; }
  #log { padding: 10px 14px; white-space: pre-wrap; }
  /* No border/padding/margin on the canvas: input coordinates are
     padding-box relative, and any border/margin skews the engine's pixel
     coordinates against getBoundingClientRect(). The canvas is sized in JS
     to exactly fill the viewport (see getWindowSize in main.js), so margin
     would also just push it past the edge of the window. */
  canvas { display: block; image-rendering: pixelated; }
  /* Autoplay toggle: hands the player's base to the mod's AI. Fixed to the
     top-right so it stays clear of the engine's own sidebar hit areas, and
     sized for a comfortable touch target on tablets. */
  #autoplay { position: fixed; top: 8px; right: 8px; z-index: 9999; background: rgba(0,0,0,0.75); color: #6f6; border: 1px solid #6f6; border-radius: 4px; font: bold 13px/1 monospace; padding: 10px 14px; cursor: pointer; }
  #autoplay.on { background: #6f6; color: #000; }
  
  /* League Table Overlay */
  #league-table { position: fixed; inset: 0; background: rgba(10,14,20,0.9); z-index: 10000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  #league-table .inner { background: #121a24; border: 1px solid #233042; padding: 24px; border-radius: 8px; width: 90%; max-width: 700px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  #league-table h2 { margin: 0 0 16px; color: #5ec8ff; font-family: sans-serif; text-align: center; }
  #league-table table { width: 100%; border-collapse: collapse; text-align: right; font-family: sans-serif; font-size: 14px; }
  #league-table th, #league-table td { padding: 8px 12px; border-bottom: 1px solid #233042; }
  #league-table th { color: #8b98a9; font-weight: normal; font-size: 12px; text-transform: uppercase; }
  #league-table tr:last-child td { border-bottom: none; }
  #league-table .won { color: #6f6; }
  #league-table .lost { color: #ff6b6b; }
  #league-close { display: block; margin: 20px auto 0; padding: 10px 20px; background: #233042; border: none; color: #fff; border-radius: 4px; cursor: pointer; font: 14px sans-serif; }
  #league-close:hover { background: #3a4b61; }
</style>
</head>
<body>
<canvas id="canvas" width="256" height="256"></canvas>
<div id="log">booting .NET wasm runtime…</div>
<button id="autoplay" type="button">AI: OFF</button>
<div id="league-table" style="display:none;">
	<div class="inner">
		<h2>League Table</h2>
		<table id="league-stats">
			<thead>
				<tr>
					<th style="text-align:left">Result</th>
					<th>Score</th>
					<th>Units Killed</th>
					<th>Units Lost</th>
					<th>Buildings Destroyed</th>
					<th>Buildings Lost</th>
				</tr>
			</thead>
			<tbody></tbody>
		</table>
		<button id="league-close">Close</button>
	</div>
</div>
<!-- __BUILD_ID__ is replaced with the commit SHA at deploy time (see
     wasm-port.yml). GitHub Pages caches every file for up to 10 minutes with
     no coordination between them, so around a deploy a browser could pair a
     cached old main.js with new engine assemblies (or vice versa) -- the two
     halves of the HiDPI canvas sizing then disagree and every click lands
     off-target. Versioning the whole script chain from here down makes the
     load all-old or all-new, never mixed. -->
<script type="module" src="./main.js?v=__BUILD_ID__"></script>
</body>
</html>
