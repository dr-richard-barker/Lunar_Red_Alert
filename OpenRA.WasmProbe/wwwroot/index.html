<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Without this, mobile browsers lay the page out at a default desktop-ish
     viewport width and then zoom the whole page to fit the screen, which is
     a real source of click/tap coordinates not lining up with what's drawn. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OpenRA WasmProbe — Phase W2</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0a0e14; color: #cdd6e2; font: 14px/1.5 monospace; }
  #log { padding: 10px 14px; white-space: pre-wrap; }
  /* No border/padding/margin on the canvas: input coordinates are
     padding-box relative, and any border/margin skews the engine's pixel
     coordinates against getBoundingClientRect(). The canvas is sized in JS
     to exactly fill the viewport (see getWindowSize in main.js), so margin
     would also just push it past the edge of the window. touch-action:none
     opts the canvas fully out of the browser's own touch gesture handling
     (scroll, pull-to-refresh, double-tap-zoom, pinch-zoom) -- main.js's own
     touchstart/move/end listeners already call preventDefault(), but
     without this some browsers still impose a wait-and-see delay before
     delivering the events at all, which reads as janky/unresponsive touch
     controls even though every gesture eventually "works". */
  canvas { display: block; image-rendering: pixelated; touch-action: none; }
  /* HUD toggle cluster: top-LEFT, not top-right. The engine's own sidebar,
     minimap and cash/power readout always render top-right (see every
     smoke-test screenshot), so a fixed right-hand cluster sat directly on
     top of the game's own chrome -- and hand-tuned `right:` offsets between
     buttons drifted out of sync with each button's actual rendered width
     the moment a label's text changed length, so buttons overlapped each
     other too. Flexbox lays the row out from each button's real width with
     no manual math, and wraps to a second line on narrow/mobile viewports
     where four buttons don't fit in one row instead of overflowing. The
     boot-time #log div sits below the always-full-viewport canvas once
     play starts (normal block flow + body's overflow:hidden), so top-left
     is clear of it too. */
  #hud-toggles { position: fixed; top: 8px; left: 8px; z-index: 9999; display: flex; flex-wrap: wrap; gap: 8px; max-width: calc(100vw - 16px); }
  #hud-toggles button { background: rgba(0,0,0,0.75); border-radius: 4px; font: bold 13px/1 monospace; padding: 10px 14px; cursor: pointer; white-space: nowrap; }
  #warpeace { color: #ff6b6b; border: 1px solid #ff6b6b; }
  #warpeace.on { background: #6f6; color: #000; border-color: #6f6; }
  #freebuild { color: #ffd35e; border: 1px solid #ffd35e; }
  #freebuild.on { background: #ffd35e; color: #000; }
  #terrain { color: #5ec8ff; border: 1px solid #5ec8ff; }
  #autoplay { color: #6f6; border: 1px solid #6f6; }
  #autoplay.on { background: #6f6; color: #000; }

  /* League Table Overlay */
  #league-table { position: fixed; inset: 0; background: rgba(10,14,20,0.9); z-index: 10000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  #league-table .inner { background: #121a24; border: 1px solid #233042; padding: 24px; border-radius: 8px; width: 90%; max-width: 700px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  #league-table h2 { margin: 0 0 16px; color: #5ec8ff; font-family: sans-serif; text-align: center; }
  #league-table table { width: 100%; border-collapse: collapse; text-align: right; font-family: sans-serif; font-size: 14px; }
  #league-table th, #league-table td { padding: 8px 12px; border-bottom: 1px solid #233042; }
  #league-table th { color: #8b98a9; font-weight: normal; font-size: 12px; text-transform: uppercase; }
  #league-table tr:last-child td { border-bottom: none; }
  #league-table .won { color: #6f6; }
  #league-table .lost { color: #ff6b6b; }
  #league-close { display: block; margin: 20px auto 0; padding: 10px 20px; background: #233042; border: none; color: #fff; border-radius: 4px; cursor: pointer; font: 14px sans-serif; }
  #league-close:hover { background: #3a4b61; }

  /* Rival Count Overlay: shown once, before PlayMode boots the actual
     match (see WebGL.GetRivalCount / main.js's getRivalCount). Kept
     hidden by default and flipped to flex only when JS is actually
     waiting on a pick, so it never flashes for the non-"play" probe
     boot paths or the ?rivals=N CI bypass. */
  #rival-select { position: fixed; inset: 0; background: rgba(10,14,20,0.92); z-index: 10001; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  #rival-select .inner { background: #121a24; border: 1px solid #233042; padding: 32px; border-radius: 8px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  #rival-select h2 { margin: 0 0 8px; color: #ff6b6b; font-family: sans-serif; }
  #rival-select p { margin: 0 0 20px; color: #8b98a9; font-family: sans-serif; font-size: 14px; }
  #rival-select .counts { display: flex; gap: 12px; justify-content: center; }
  #rival-select button { width: 56px; height: 56px; font: bold 22px/1 monospace; background: #1a2330; border: 2px solid #ff6b6b; color: #ff6b6b; border-radius: 8px; cursor: pointer; }
  #rival-select button:hover { background: #ff6b6b; color: #000; }
  /* Terrain row: same overlay, a second choice (battlefield) ahead of rival
     count. Blue accent (matching the in-game #terrain HUD toggle) keeps it
     visually distinct from the red rival-count buttons above/below it.
     One .selected class at a time marks the active pick -- defaults to
     Moon (see main.js's terrainMode default) so the pre-highlighted button
     matches what actually launches if the player just clicks a rival count
     without touching this row. */
  #rival-select .terrains { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; }
  #rival-select .terrains button { width: auto; height: auto; padding: 10px 18px; font: bold 15px/1 monospace; border-color: #5ec8ff; color: #5ec8ff; }
  #rival-select .terrains button:hover { background: #5ec8ff; color: #000; }
  #rival-select .terrains button.selected { background: #5ec8ff; color: #000; }
</style>
</head>
<body>
<canvas id="canvas" width="256" height="256"></canvas>
<div id="log">booting .NET wasm runtime…</div>
<div id="hud-toggles">
	<button id="warpeace" type="button">War: ON</button>
	<button id="freebuild" type="button">Free Build: OFF</button>
	<button id="terrain" type="button">Terrain: Earth</button>
	<button id="autoplay" type="button">AI: OFF</button>
</div>
<div id="league-table" style="display:none;">
	<div class="inner">
		<h2>League Table</h2>
		<table id="league-stats">
			<thead>
				<tr>
					<th style="text-align:left">Result</th>
					<th>Score</th>
					<th>Units Killed</th>
					<th>Units Lost</th>
					<th>Buildings Destroyed</th>
					<th>Buildings Lost</th>
				</tr>
			</thead>
			<tbody></tbody>
		</table>
		<button id="league-close">Close</button>
	</div>
</div>
<div id="rival-select">
	<div class="inner">
		<h2>Incoming AI Rivals</h2>
		<p>Choose a battlefield:</p>
		<div class="terrains">
			<button type="button" data-terrain="earth">Earth</button>
			<button type="button" data-terrain="lunar" class="selected">Moon</button>
			<button type="button" data-terrain="mars">Mars</button>
		</div>
		<p>How many AI-controlled rivals should build a base and fight you?</p>
		<div class="counts">
			<button type="button" data-count="1">1</button>
			<button type="button" data-count="2">2</button>
			<button type="button" data-count="3">3</button>
			<button type="button" data-count="4">4</button>
		</div>
	</div>
</div>
<!-- __BUILD_ID__ is replaced with the commit SHA at deploy time (see
     wasm-port.yml). GitHub Pages caches every file for up to 10 minutes with
     no coordination between them, so around a deploy a browser could pair a
     cached old main.js with new engine assemblies (or vice versa) -- the two
     halves of the HiDPI canvas sizing then disagree and every click lands
     off-target. Versioning the whole script chain from here down makes the
     load all-old or all-new, never mixed. -->
<script type="module" src="./main.js?v=__BUILD_ID__"></script>
</body>
</html>
