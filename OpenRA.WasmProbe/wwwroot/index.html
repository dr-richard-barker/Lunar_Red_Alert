<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Without this, mobile browsers lay the page out at a default desktop-ish
     viewport width and then zoom the whole page to fit the screen, which is
     a real source of click/tap coordinates not lining up with what's drawn. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OpenRA WasmProbe — Phase W2</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0a0e14; color: #cdd6e2; font: 14px/1.5 monospace; }
  #log { padding: 10px 14px; white-space: pre-wrap; }
  /* No border/padding/margin on the canvas: input coordinates are
     padding-box relative, and any border/margin skews the engine's pixel
     coordinates against getBoundingClientRect(). The canvas is sized in JS
     to exactly fill the viewport (see getWindowSize in main.js), so margin
     would also just push it past the edge of the window. */
  canvas { display: block; image-rendering: pixelated; }
  /* Temporary on-screen diagnostic, added to debug a click-alignment report
     that persisted across several rendering fixes -- shows live geometry
     and the last click/tap position directly on the page, since we can't
     attach devtools to a real user's device. Remove once resolved. */
  #diag { position: fixed; top: 0; left: 0; z-index: 9999; background: rgba(0,0,0,0.8); color: #6f6; font: 11px/1.4 monospace; padding: 4px 8px; white-space: pre; pointer-events: none; }
  #diag-marker { position: fixed; z-index: 9999; width: 24px; height: 24px; margin-left: -12px; margin-top: -12px; border: 3px solid #f33; border-radius: 50%; pointer-events: none; display: none; box-sizing: border-box; }
</style>
</head>
<body>
<canvas id="canvas" width="256" height="256"></canvas>
<div id="log">booting .NET wasm runtime…</div>
<div id="diag"></div>
<div id="diag-marker"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
