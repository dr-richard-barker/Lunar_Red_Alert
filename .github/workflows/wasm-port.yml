name: WASM Port

# Phase W0 harness for the OpenRA-in-browser port (see WASM-PORT-PLAN.md).
# Manual dispatch + probe-path pushes only, so normal development doesn't pay for it.
on:
  workflow_dispatch:
  push:
    paths:
      - 'OpenRA.WasmProbe/**'
      - '.github/workflows/wasm-port.yml'
      # The port compiles the engine + mods into the bundle, so their changes
      # must re-run the wasm gates too.
      - 'OpenRA.Game/**'
      - 'OpenRA.Mods.Common/**'
      - 'OpenRA.Mods.Cnc/**'
      - 'OpenRA.Platforms.Browser/**'
      # mod.yaml/rules changes affect what gets staged and how the boot's
      # content check resolves (a mod-only fix once silently skipped this
      # entire pipeline because none of the above paths matched it).
      - 'mods/spaceage/**'
      - 'mods/ra-content/**'
      - 'mods/common-content/**'

permissions:
  contents: read

# One run per ref: a new push supersedes (cleanly cancels) the previous run.
concurrency:
  group: wasm-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: browser-wasm probe (OpenRA.Game)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Install .NET 10.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish probe for browser-wasm
        # The actual experiment: can OpenRA.Game + its NuGet closure publish
        # against the .NET browser runtime? Log everything; fail loudly.
        run: |
          set -o pipefail
          dotnet publish OpenRA.WasmProbe/OpenRA.WasmProbe.csproj -c Release 2>&1 | tee wasm-publish.log

      - name: Summarize output payload
        if: success()
        # Directory.Build.props redirects publish output to the repo-root bin/publish/.
        run: |
          echo "== published payload (bin/publish) =="
          find bin/publish -type f | head -40
          du -sh bin/publish/wwwroot 2>/dev/null || du -sh bin/publish 2>/dev/null || true

      - name: Stage real mod files as probe data (Phase W3a)
        if: success()
        # The probe fetches these over the host (fetch() in the browser, disk
        # under Node) and runs them through the real engine loaders in-wasm.
        run: |
          WWWROOT=$(dirname "$(find bin/publish -name dotnet.js -path '*_framework*' | head -1)")/..
          mkdir -p "$WWWROOT/probe-data/mods" "$WWWROOT/probe-data/glsl"
          # W3g: all text assets (rules/weapons/sequences/fluent/scripts/...)
          # from the three mounted trees, preserving directory structure —
          # including empty dirs (e.g. uibits) that the manifest Folder-mounts.
          # W3i-b adds binaries: fonts (.ttf) and chrome/logo art (.png).
          # Later fix: loose-folder maps (not zipped .oramap) need their own
          # map.bin (tile data, REQUIRED -- its absence threw a
          # FileNotFoundException per map during MapCache scanning, expensive
          # enough across ~74 maps on a single interpreted wasm thread to look
          # like a hang) plus a few per-map custom overrides (.shp/.pal/.aud).
          # .dat: ra/uibits/"global mix database.dat" -- MIX archives store only
          # filename hashes, never names; several content mixes (lores/hires/
          # local/speech/expand/desert) ship with no embedded per-mix filename
          # database, so nothing inside them (e.g. mouse.shp) can ever resolve
          # a real name without this external one, built from every filename
          # this repo's own YAML already references.
          rsync -a --include='*/' --include='*.yaml' --include='*.ftl' --include='*.lua' \
            --include='*.ttf' --include='*.png' --include='*.oramap' \
            --include='*.bin' --include='*.shp' --include='*.pal' --include='*.aud' \
            --include='*.dat' --exclude='*' \
            mods/ra mods/ra-content mods/common mods/common-content mods/spaceage "$WWWROOT/probe-data/mods/"
          # W3i: engine shaders — the Renderer compiles these from EngineDir/glsl.
          cp glsl/*.vert glsl/*.frag "$WWWROOT/probe-data/glsl/"
          # W4a: RA freeware content via OpenRA's own quickinstall channel
          # (SHA1-pinned zip from the official mirror list — the same download
          # every desktop OpenRA install performs). Staged to the SupportDir
          # content path the ra manifest expects.
          # Try every listed mirror in turn -- the first one has intermittently
          # been an infinite self-redirect loop (curl exit 47), which otherwise
          # fails this whole job even though the content is available elsewhere.
          curl -fsSL https://www.openra.net/packages/ra-quickinstall-mirrors.txt | grep '^http' > /tmp/mirrors.txt
          fetched=0
          while read -r MIRROR; do
            echo "trying content mirror: $MIRROR"
            if curl -fsSL --max-redirs 10 --max-time 60 "$MIRROR" -o /tmp/ra-quickinstall.zip \
              && echo "44241f68e69db9511db82cf83c174737ccda300b  /tmp/ra-quickinstall.zip" | sha1sum -c; then
              fetched=1
              break
            fi

            echo "mirror failed, trying next..."
          done < /tmp/mirrors.txt
          if [ "$fetched" -ne 1 ]; then
            echo "::error::All content mirrors failed"
            exit 1
          fi
          mkdir -p "$WWWROOT/probe-data/supportdir/Content/ra/v2"
          unzip -q -o /tmp/ra-quickinstall.zip -d "$WWWROOT/probe-data/supportdir/Content/ra/v2/"
          # ONE archive instead of ~730 individual fetches: the probe pulls
          # this single blob and extracts it into MEMFS (ZipArchive).
          (cd "$WWWROOT/probe-data" && zip -q -r -0 ../probe-data.zip .)
          ls -lh "$WWWROOT/probe-data.zip"; du -sh "$WWWROOT/probe-data"

      # NOTE: the Node execution gate was removed once the Chromium gate
      # covered the same host-agnostic demos (W1/W3a/W3e/W3f/W3g) plus the
      # DOM ones. Node's serial JSImport marshalling over ~600 staged files
      # had become the run's bottleneck.

      - name: Install Playwright Chromium (Phase W2)
        if: success()
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright > /dev/null
          npx playwright install --with-deps chromium

      - name: Execute probe in Chromium (Phases W2 + W3)
        if: success()
        # W2: WebGL2 textured quad, pixel-verified from C#. W3a: real mod rules
        # fetched over HTTP and merged in-wasm. W3b: 60 managed frames driven by
        # requestAnimationFrame (game-loop inversion primitive).
        run: |
          set -o pipefail
          WWWROOT=$(dirname "$(find bin/publish -name dotnet.js -path '*_framework*' | head -1)")/..
          (cd "$WWWROOT" && python3 -m http.server 8123) &
          sleep 2
          node OpenRA.WasmProbe/browser-test.mjs http://127.0.0.1:8123/ 2>&1 | tee wasm-browser.log
          grep -q "W2 SUCCESS" wasm-browser.log
          grep -q "W3a SUCCESS" wasm-browser.log
          grep -q "W3b SUCCESS" wasm-browser.log
          grep -q "W3c SUCCESS" wasm-browser.log
          grep -q "W3d SUCCESS" wasm-browser.log
          grep -q "W3e SUCCESS" wasm-browser.log
          grep -q "W3f SUCCESS" wasm-browser.log
          grep -q "W3g SUCCESS" wasm-browser.log
          grep -q "W3h SUCCESS" wasm-browser.log
          grep -q "W3i SUCCESS" wasm-browser.log
          grep -q "W3i-b SUCCESS" wasm-browser.log
          grep -q "W4b SUCCESS" wasm-browser.log

      - name: Upload probe logs & payload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-probe-output
          path: |
            wasm-publish.log
            wasm-browser.log
            wasm-run.log
            wasm-screenshot.png
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare deployable bundle (W5b — freeware content included)
        if: success()
        # Repo-owner decision (2026-07-29): serve the RA freeware content from
        # the site so the game plays directly. The content is EA's 2008
        # freeware release, fetched at build time from OpenRA's official
        # mirror list (SHA1-pinned) — it is NEVER committed to this repo and
        # can be removed by reverting this step. A provenance/takedown notice
        # ships beside it.
        run: |
          WWWROOT=$(dirname "$(find bin/publish -name dotnet.js -path '*_framework*' | head -1)")/..
          # Stamp the script chain with this build's SHA (see index.html's
          # __BUILD_ID__ comment): makes cross-deploy cache mixes impossible
          # and lets the on-page diagnostic report which build is running.
          sed -i "s/__BUILD_ID__/${GITHUB_SHA::9}/g" "$WWWROOT/index.html" "$WWWROOT/main.js"
          {
            echo "CONTENT NOTICE"
            echo "The game data files under probe-data/supportdir/ are the"
            echo "Command & Conquer: Red Alert assets that Electronic Arts"
            echo "released as freeware in 2008. They are obtained at deploy"
            echo "time from the OpenRA project's official content mirrors"
            echo "(https://www.openra.net/packages/ra-quickinstall-mirrors.txt,"
            echo "SHA1 44241f68e69db9511db82cf83c174737ccda300b) and are served"
            echo "here solely so the browser build is playable. They are not"
            echo "part of this repository. Rights holders: to request removal,"
            echo "open an issue at"
            echo "https://github.com/dr-richard-barker/Lunar_Red_Alert/issues"
          } > "$WWWROOT/CONTENT-NOTICE.txt"
          du -sh "$WWWROOT"

      - name: Upload deployable bundle
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-game-bundle
          path: bin/publish/wwwroot
          retention-days: 3

  deploy:
    name: Deploy site + engine to Pages
    needs: probe
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Download game bundle
        uses: actions/download-artifact@v4
        with:
          name: wasm-game-bundle
          path: site-game

      - name: Assemble site (docs + engine at /play-wasm)
        run: |
          mkdir -p site
          cp -r docs/* site/
          mkdir -p site/play-wasm
          cp -r site-game/* site/play-wasm/
          du -sh site site/play-wasm

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  playwasm-smoke-test:
    name: Live /play-wasm/ smoke test
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Install Playwright Chromium
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright > /dev/null
          npx playwright install --with-deps chromium

      - name: Hit the live deployed page and require a real boot
        # Coverage for the class of bug that shipped silently once before:
        # PlayMode.Run() (the deployed page's actual boot path) has no gates
        # of its own, so a regression here was only ever discoverable by a
        # human loading the page. This waits for the real "[play] boot
        # complete" console line against the page GitHub Pages just served,
        # not a synthetic probe path.
        run: |
          set -o pipefail
          node OpenRA.WasmProbe/playwasm-smoke-test.mjs "${{ needs.deploy.outputs.page_url }}play-wasm/" 2>&1 | tee playwasm-smoke.log

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwasm-smoke-output
          path: |
            playwasm-smoke.log
            playwasm-smoke-screenshot.png
          if-no-files-found: warn
          retention-days: 7
